spring:
  application:
    name: adventure books
  datasource:
    url: jdbc:h2:file:./data/adventuredb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
